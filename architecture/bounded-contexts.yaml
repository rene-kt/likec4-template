bounded_contexts:
  - id: account
    title: Contas
    description: Mantém o cadastro e os dados básicos de clientes.
  - id: catalog
    title: Catálogo
    description: Organiza os itens disponíveis para consulta e compra.
  - id: orders
    title: Pedidos
    description: Registra e acompanha pedidos feitos pelos clientes.
    subcontexts:
      - id: checkout
        title: Checkout
        description: Conduz a jornada de compra até a criação do pedido.
  - id: notifications
    title: Comunicações
    description: Recebe eventos de pedidos e prepara mensagens para clientes.
  - id: payments
    title: Pagamentos
    description: Coordena a compra e o processamento de pagamentos.
    subcontexts:
      - id: purchase
        title: Compra
        description: Conduz a confirmação da compra e registra tentativas de pagamento.
      - id: processor
        title: Processamento
        description: Adapta solicitações de pagamento e publica resultados de processamento.
